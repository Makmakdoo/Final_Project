<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesolocM_BSIT2C</title>
    <style>
        
        header{
            text-align: center;
            padding: 15px 20px;
            background: rgb(182, 226, 233);

            display: flex;
            justify-content:center;
            align-items: center;
            gap: 30px;

            position: fixed;
            bottom: 25px;
            left: 51%;
            transform: translateX(-50%);

            backdrop-filter: blur(15px);
            border-radius: 60px;
            z-index: 1000 ;
        }


        nav a{
            color: rgb(94, 134, 173);
            font-weight: 1000;
            text-decoration: none;
            padding: 10px 10px;
            display: inline-block;
            font-family: 'Happy Serif', 'Serif';
            font-size:larger;

        }

        .bgvid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        .wcmsg{
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            font-family: 'Pixels','Serif';
            font-size:xxx-large;
        }


        @font-face {
            font-family: "Happy Serif";
            src: url(Fonts/Happy\ Serif.ttf);
            font-family: "Sweet Dreams";
            src: url(Fonts/Sweet\ Dreams.ttf);
            font-family: "Pixels";
             src: url(Fonts/Pixelta.ttf);
        }

    </style>
</head>
<body>
    <header>
        <nav> 
            <a href= "#home"> Home </a>
            <a href= "#about"> About </a>
            <a href= "#projects"> Projects </a>
            <a href= "#contact"> Contact </a>
        </nav>
    </header>

    <video class="bgvid" autoplay muted loop playsinline>
        <source src="Videos/Homepage_BG.mp4" type="video/mp4">
    </video>

    <div class="wcmsg">

        <svg viewBox="0 0 700 180" class="anmtn">

            <text x="50%" y="65"
            text-anchor="middle"
            class="first">
            Welcome to
        </text>

        <text x="50%" y="100"
            text-anchor="middle"
            class="second">
            Dream World
        </text>
            
        </svg>
    </div>


</body>
</html>
