<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesolocM_BSIT2C</title>
    <style>

        /* nav*/
       
          /*bg*/
        .bgvid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }
             /* Welcome Message*/
        .wcmsg{
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            font-family: 'Pixels','Serif';
            font-size:xxx-large;
            text-shadow: 0 0 10px rgb(255, 255, 255);
        }
        
        .first{
            fill:rgb(243, 232, 216)
        }

         .second{
            fill:rgb(243, 232, 216)
        }

        /*Cloud Arrow*/

        .arrow {
            position: fixed;
            bottom: 30px;
            right: 40px;
        }

        .enter{
        color: #FFFFFF;
        font-family: 'Happy Serif', serif;
        margin: 0 0 5px 0;
        font-size:medium; 
        }

        .cloud-button {
            background: none;
            border: none;
            cursor: pointer;
        }

        .cloud-button img {
            width: 100px;
            display: block;
        }


        .dreampop {
            position: absolute;
            margin-bottom: 5px;
            right: 0;
            width: 180px;
            padding: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            display: none;
        }

        .dreampop p {
            color: #5A86AD;
        }

        .dreampop a, .dreampop button {
            display: inline-block;
            width: 50px;
            margin: 3px;
            padding: 7x 0;
            border: none;
            border-radius: 10px;
            background: #B6E2E9;
            color: #5A86AD;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            font-family: 'Happy Serif', serif;
            cursor: pointer;
        }

             /*Dafonts*/
        @font-face {
            font-family: "Happy Serif";
            src: url(Fonts/Happy\ Serif.ttf);
            font-family: "Sweet Dreams";
            src: url(Fonts/Sweet\ Dreams.ttf);
            font-family: "Pixels";
             src: url(Fonts/Pixelta.ttf);
        }

    </style>
</head>
<body>

    <video class="bgvid" autoplay muted loop playsinline>
        <source src="Videos/Homepage_BG.mp4" type="video/mp4">
    </video>

    <div class="wcmsg">

        <svg viewBox="0 0 700 180" class="anmtn">

            <text x="50%" y="65" text-anchor="middle" class="first">
                Welcome to
            </text>

            <text x="50%" y="110" text-anchor="middle" class="second">
                Dream Land!
            </text>

        </svg>

    <div class="arrow">
       
        <div class="dreampop" id="drem">
                <p class="enter">Enter the Dream?</p>
                <a href="#about">Yes</a>
                <button onclick="closePopup()">No</button>
         </div>

         <button class="cloud-button" onclick="openPopup()">
             <img src="Photos/clawd.png" alt="Cloud">
         </button>

    </div>

    <script>
        function openPopup() {
            document.getElementById("drem").style.display = "block";
        }

        function closePopup() {
            document.getElementById("drem").style.display = "none";
        }
    </script>
</body>
</html>
